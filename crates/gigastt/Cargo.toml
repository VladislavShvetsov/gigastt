[package]
name = "gigastt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GigaAM speech recognition CLI for CPU and NVIDIA CUDA 13"

[features]
default = ["diarization"]
cuda = ["gigastt-core/cuda"]
diarization = ["gigastt-core/diarization"]
quantize = ["gigastt-core/quantize"]

[dependencies]
gigastt-core = { path = "../gigastt-core", default-features = false, features = ["net", "async-pool", "file-decode", "quantize"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
gigastt-core = { path = "../gigastt-core", default-features = false, features = ["net", "async-pool", "file-decode", "quantize", "diarization", "__internals"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

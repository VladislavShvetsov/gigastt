[workspace]
members = ["crates/gigastt-core", "crates/gigastt-quantize", "crates/gigastt"]
default-members = ["crates/gigastt"]
resolver = "3"

[workspace.package]
version = "2.22.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/VladislavShvetsov/gigastt"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

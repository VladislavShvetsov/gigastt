[package]
name = "gigastt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core inference engine for gigastt — GigaAM v3 ONNX Runtime, model management, CPU/CUDA streaming"
keywords = ["stt", "speech-recognition", "gigaam", "onnx", "russian"]
categories = ["multimedia::audio"]

[lib]
crate-type = ["rlib"]
bench = false

[features]
default = ["diarization", "net", "async-pool", "file-decode", "quantize"]
cuda = ["ort/cuda"]
diarization = ["dep:polyvoice"]
net = ["dep:reqwest", "dep:tokio", "dep:futures-util"]  # HTTP model download
async-pool = ["dep:tokio"]                              # async Pool::checkout; blocking path needs neither
file-decode = ["dep:symphonia", "dep:ryf", "dep:opus-rs"] # file transcription; raw-PCM streaming does not need it
ort-load-dynamic = ["ort/load-dynamic"]                 # system/vendored onnxruntime instead of download-binaries
quantize = ["dep:gigastt-quantize"]
__internals = []

[dependencies]
sha2 = { version = "0.11", default-features = false }
memchr = { version = "2", default-features = false }
ort = "=2.0.0-rc.15"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "fs"], optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", features = ["stream"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
rustfft = "6"
rubato = "5.0"
symphonia = { version = "0.6.1", features = ["aac", "isomp4", "mkv", "mp3", "ogg", "flac", "pcm", "wav"], optional = true }
ryf = { version = "0.7", optional = true }
opus-rs = { version = "0.1", optional = true }
bytes = "1"
gigastt-quantize = { version = "2.22.0", path = "../gigastt-quantize", optional = true }
polyvoice = { version = "1.0.0", default-features = false, features = ["backend-tract"], optional = true }
parking_lot = "0.12"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
proptest = "1"
audio-codec = { version = "0.4", default-features = false }
